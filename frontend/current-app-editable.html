    menu.hidden = true;
  });
  root.querySelectorAll(".task-detail-select-button").forEach((button) => {
    button.setAttribute("aria-expanded", "false");
  });
}

function renderTaskDatePanel(picker) {
  const input = picker.querySelector('input[data-field="dueDate"]');
  const panel = picker.querySelector(".task-date-panel");
  const viewDate = parseIsoDate(picker.dataset.viewDate || input.value || todayIsoDate());
  const selected = input.value;
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const first = new Date(year, month, 1);
  const start = new Date(year, month, 1 - first.getDay());
  const days = [];

  for (let index = 0; index < 42; index += 1) {
    const current = new Date(start);
    current.setDate(start.getDate() + index);
    const iso = toIsoDate(current);
    const classes = [
      "task-date-day",
      current.getMonth() === month ? "" : "is-muted",
      iso === selected ? "is-selected" : "",
      iso === todayIsoDate() ? "is-today" : ""
    ].filter(Boolean).join(" ");
    days.push(`<button class="${classes}" type="button" data-date-value="${iso}">${current.getDate()}</button>`);
  }

  panel.innerHTML = `
    <div class="task-date-head">
      <strong class="task-date-title">${year}年${pad2(month + 1)}月</strong>
      <span class="task-date-nav">
        <button type="button" data-date-action="prev" aria-label="上个月">‹</button>
        <button type="button" data-date-action="next" aria-label="下个月">›</button>
      </span>
    </div>
    <div class="task-date-grid">
      ${["日", "一", "二", "三", "四", "五", "六"].map((day) => `<span class="task-date-week">${day}</span>`).join("")}
      ${days.join("")}
    </div>
    <div class="task-date-foot">
      <button type="button" data-date-action="clear">清除</button>
      <button type="button" data-date-action="today">今天</button>
    </div>
  `;
}

function shiftMonth(isoDate, offset) {
  const date = parseIsoDate(isoDate || todayIsoDate());
  date.setMonth(date.getMonth() + offset, 1);
  return toIsoDate(date);
}

function scheduleTaskAutoSave(root, task) {
  const status = root.querySelector(".save-state");
  saveStatusText = "正在自动保存...";
  if (status) status.textContent = saveStatusText;
  clearTimeout(editorSaveTimer);
  editorSaveTimer = setTimeout(async () => {
    commitTaskDetail(root, task);
    await saveAppState();
    saveStatusText = "已自动保存";
    if (status) status.textContent = saveStatusText;
  }, 280);
}

function commitTaskDetail(root, task) {
  const title = root.querySelector('[data-field="title"]').value.trim();
  const notes = root.querySelector('[data-field="notes"]').value.trim();
  const previousStatus = task.status;
  const nextStatus = normalizeTaskStatus(root.querySelector('[data-field="status"]').value);
  task.title = title;
  task.content = title;
  task.notes = notes;
  task.status = nextStatus;
  task.priority = normalizeTaskPriority(root.querySelector('[data-field="priority"]').value);
  task.dueDate = normalizeTaskDueDate(root.querySelector('[data-field="dueDate"]').value);
  task.tags = parseTags(root.querySelector('[data-field="tags"]').value);
  task.completed = nextStatus === "done";
  task.updatedAt = Date.now();
  if (nextStatus === "done" && previousStatus !== "done") {
    task.completedAt = task.updatedAt;
  }
  if (nextStatus !== "done") {
    task.completedAt = null;
  }
}

function saveCurrentTaskEdit(options = {}) {
  const task = state.tasks.find((item) => item.id === state.editingTaskId);
  if (!task) return;
  if (!task.title.trim() && !task.notes.trim()) {
    state.tasks = state.tasks.filter((item) => item.id !== task.id);
  }
  state.editingTaskId = null;
  saveAppState();
  if (options.deferRender) {
    setTimeout(render, 0);
  } else {
    render();
  }
}

function currentTask() {
  return state.tasks.find((task) => task.id === state.detailTaskId);
}

function toggleTask(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  const now = Date.now();
  task.status = task.status === "done" ? "todo" : "done";
  task.completed = task.status === "done";
  task.updatedAt = now;
  task.completedAt = task.status === "done" ? now : null;
  persistAndRender();
}

function deleteTask(taskId) {
  state.tasks = state.tasks.filter((task) => task.id !== taskId);
  if (state.detailTaskId === taskId) {
    state.route = "home";
    state.detailTaskId = null;
  }
  if (state.editingTaskId === taskId) state.editingTaskId = null;
  persistAndRender();
}

function taskStatusOption(value, current, label) {
  return `<option value="${value}"${current === value ? " selected" : ""}>${escapeHtml(label)}</option>`;
}

function taskPriorityOption(value, current, label) {
  return `<option value="${value}"${current === value ? " selected" : ""}>${escapeHtml(label)}</option>`;
}

function taskStatusLabel(status) {
  return {
    todo: "待完成",
    doing: "进行中",
    done: "已完成"
  }[status] || "待完成";
}

function taskPriorityLabel(priority) {
  return {
    high: "高",
    medium: "中",
    low: "低"
  }[priority] || "";
}

function compareTasks(a, b) {
  if (a.status === "done" || b.status === "done") {
    if (a.status === "done" && b.status !== "done") return 1;
    if (a.status !== "done" && b.status === "done") return -1;
    return (b.completedAt || b.updatedAt) - (a.completedAt || a.updatedAt);
  }
  const overdueDiff = Number(isTaskOverdue(b)) - Number(isTaskOverdue(a));
  if (overdueDiff) return overdueDiff;
  const todayDiff = Number(isTaskDueToday(b)) - Number(isTaskDueToday(a));
  if (todayDiff) return todayDiff;
  const priorityDiff = taskPriorityWeight(b.priority) - taskPriorityWeight(a.priority);
  if (priorityDiff) return priorityDiff;
  return b.updatedAt - a.updatedAt;
}

function taskPriorityWeight(priority) {
  return {
    high: 3,
    medium: 2,
    low: 1,
    none: 0
  }[priority] || 0;
}

function taskMatchesDateFilter(task, filter) {
  if (filter === "today") return isTaskDueToday(task);
  if (filter === "soon") return isTaskDueSoon(task);
  if (filter === "overdue") return isTaskOverdue(task);
  if (filter === "none") return !task.dueDate;
  return true;
}

function isTaskDueToday(task) {
  return task.dueDate === todayIsoDate();
}

function isTaskDueSoon(task) {
  if (!task.dueDate) return false;
  const due = dateOnlyTime(task.dueDate);
  const today = dateOnlyTime(todayIsoDate());
  const diffDays = Math.round((due - today) / (24 * 60 * 60 * 1000));
  return diffDays >= 0 && diffDays <= 7;
}

function isTaskOverdue(task) {
  return task.status !== "done" && task.dueDate && dateOnlyTime(task.dueDate) < dateOnlyTime(todayIsoDate());
}

function formatTaskDueDate(task) {
  if (!task.dueDate) return "无日期";
  if (isTaskOverdue(task)) return `逾期 ${formatShortDate(task.dueDate)}`;
  if (isTaskDueToday(task)) return "今天到期";
  return `截止 ${formatShortDate(task.dueDate)}`;
}

function todayIsoDate() {
  const date = new Date();
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function dateOnlyTime(isoDate) {
  return Date.parse(`${isoDate}T00:00:00`);
}

function formatShortDate(isoDate) {
  const match = String(isoDate).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? `${Number(match[2])}/${Number(match[3])}` : isoDate;
}

function formatDisplayDate(isoDate) {
  const date = parseIsoDate(isoDate);
  return `${date.getFullYear()}/${pad2(date.getMonth() + 1)}/${pad2(date.getDate())}`;
}

function parseIsoDate(isoDate) {
  const parsed = new Date(`${isoDate}T00:00:00`);
  return Number.isNaN(parsed.getTime()) ? new Date() : parsed;
}

function toIsoDate(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function pad2(value) {
  return String(value).padStart(2, "0");
}

function bindInlineDeleteConfirm(deleteButton, onConfirm) {
  if (!deleteButton) return;
  deleteButton.classList.add("delete-confirm-anchor");
  deleteButton.addEventListener("click", (event) => {
    event.stopPropagation();
    if (deleteButton.classList.contains("is-confirming")) {
      onConfirm();
      return;
    }

    closeInlineDeleteConfirms(deleteButton);
    deleteButton.classList.add("is-confirming");
    deleteButton.title = "确认删除";
    deleteButton.setAttribute("aria-label", "确认删除");
    deleteButton.focus();
  });
}

function closeInlineDeleteConfirms(exceptButton = null) {
  document.querySelectorAll(".delete-confirm-anchor.is-confirming").forEach((button) => {
    if (button === exceptButton) return;
    button.classList.remove("is-confirming");
    button.title = "删除";
    button.setAttribute("aria-label", "删除");
  });
}

function cleanupEmptyDraftTasks() {
  state.tasks = state.tasks.filter((task) => task.title.trim() || task.notes.trim());
}

function createEmptyState(message, templateId) {
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.innerHTML = `
    <span class="empty-mark">${icon(templateId)}</span>
    <span>${escapeHtml(message)}</span>
  `;
  return empty;
}

function focusEditorInput(selector) {
  requestAnimationFrame(() => {
    const input = content.querySelector(selector);
    if (!input) return;
    input.focus();
    if (typeof input.setSelectionRange === "function") {
      const length = input.value.length;
      input.setSelectionRange(length, length);
    }
  });
}

function markdownToSummaryHtml(markdown) {
  const html = markdownToHtml(markdown);
  const wrapper = document.createElement("div");
  wrapper.innerHTML = html;
  wrapper.querySelectorAll("img, hr, blockquote").forEach((node) => node.remove());
  return wrapper.innerHTML || "<p>暂无内容</p>";
}

function markdownToHtml(markdown, note = null) {
  const lines = String(markdown || "").split(/\r?\n/);
  const html = [];
  let listType = null;

  function closeList() {
    if (!listType) return;
    html.push(`</${listType}>`);
    listType = null;
  }

  lines.forEach((line) => {
    const raw = line.trim();
    if (!raw) {
      closeList();
      return;
    }

    const image = raw.match(/^!\[(.*?)]\((.*?)\)$/);
    if (image) {
      closeList();
      const markdownPath = image[2];
      const resource = note && Array.isArray(note.images)
        ? note.images.find((item) => item.markdownPath === markdownPath || item.fileName === markdownPath)
        : null;
      const src = resource && resource.src ? resource.src : markdownPath;
      html.push(`<img src="${escapeAttr(src)}" data-markdown-src="${escapeAttr(markdownPath)}" alt="${escapeAttr(image[1])}">`);
      return;
    }

    if (/^---+$/.test(raw)) {
      closeList();
      html.push("<hr>");
      return;
    }

    const heading = raw.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      closeList();
      const level = heading[1].length;
      html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
      return;
    }

    if (raw.startsWith("> ")) {
      closeList();
      html.push(`<blockquote>${inlineMarkdown(raw.slice(2))}</blockquote>`);
      return;
    }

    const todo = raw.match(/^[-*]\s+\[( |x|X)]\s+(.+)$/);
    if (todo) {
      closeList();
      html.push(createNoteTodoHtml(todo[2], todo[1].toLowerCase() === "x"));
      return;
    }

    const ordered = raw.match(/^\d+\.\s+(.+)$/);
    if (ordered) {
      if (listType !== "ol") {
        closeList();
        listType = "ol";
        html.push("<ol>");
      }
      html.push(`<li>${inlineMarkdown(ordered[1])}</li>`);
      return;
    }

    const unordered = raw.match(/^[-*]\s+(.+)$/);
    if (unordered) {
      if (listType !== "ul") {
        closeList();
        listType = "ul";
        html.push("<ul>");
      }
      html.push(`<li>${inlineMarkdown(unordered[1])}</li>`);
      return;
    }

    closeList();
    html.push(`<p>${inlineMarkdown(raw)}</p>`);
  });

  closeList();
  return html.join("");
}

function createNoteTodoHtml(text, checked) {
  const doneClass = checked ? " is-done" : "";
  return `<div class="note-todo${doneClass}" data-checked="${checked ? "true" : "false"}"><button class="note-todo-check" type="button" contenteditable="false" aria-label="${checked ? "标记未完成" : "标记完成"}"></button><span class="note-todo-text">${inlineMarkdown(text)}</span></div>`;
}

function inlineMarkdown(value) {
  return escapeHtml(value)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

function htmlToMarkdown(html) {
  const root = document.createElement("div");
  root.innerHTML = html;
  const lines = [];

  function textWithInline(node) {
    if (node.nodeType === Node.TEXT_NODE) return node.textContent;
    if (node.nodeType !== Node.ELEMENT_NODE) return "";
    const tag = node.tagName.toLowerCase();
    const inner = Array.from(node.childNodes).map(textWithInline).join("");
    if (tag === "strong" || tag === "b") return `**${inner}**`;
    if (tag === "em" || tag === "i") return `*${inner}*`;
    if (tag === "s" || tag === "strike") return `~~${inner}~~`;
    if (tag === "u") return inner;
    if (tag === "code") return `\`${inner}\``;
    if (tag === "br") return "\n";
    return inner;
  }

  function visit(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.textContent.trim();
      if (text) lines.push(text);
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName.toLowerCase();
    if (tag === "h1" || tag === "h2" || tag === "h3") {
      lines.push(`${"#".repeat(Number(tag[1]))} ${textWithInline(node).trim()}`);
      return;
    }
    if (tag === "blockquote") {
      lines.push(`> ${textWithInline(node).trim()}`);
      return;
    }
    if (tag === "hr") {
      lines.push("---");
      return;
    }
    if (tag === "img") {
      const src = node.getAttribute("data-markdown-src") || node.getAttribute("src") || "";
      const alt = node.getAttribute("alt") || "image";
      lines.push(`![${alt}](${src})`);
      return;
    }
    if (node.classList.contains("note-todo")) {
      const checked = node.classList.contains("is-done") || node.dataset.checked === "true";
      lines.push(`- [${checked ? "x" : " "}] ${textWithInline(node.querySelector(".note-todo-text") || node).trim()}`);
      return;
    }
    if (tag === "ul" || tag === "ol") {
      Array.from(node.children).forEach((child, index) => {
        const prefix = tag === "ol" ? `${index + 1}.` : "-";
        lines.push(`${prefix} ${textWithInline(child).trim()}`);
      });
      return;
    }
    if (tag === "p" || tag === "div") {
      const text = textWithInline(node).trim();
      if (text) lines.push(text);
      return;
    }
    Array.from(node.childNodes).forEach(visit);
  }

  Array.from(root.childNodes).forEach(visit);
  return lines.join("\n\n").trim();
}

function markdownToPlainText(markdown) {
  return String(markdown || "")
    .replace(/!\[(.*?)]\((.*?)\)/g, "$1")
    .replace(/^#{1,3}\s+/gm, "")
    .replace(/^>\s+/gm, "")
    .replace(/^[-*]\s+\[[ xX]]\s+/gm, "")
    .replace(/^[-*]\s+/gm, "")
    .replace(/^\d+\.\s+/gm, "")
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/\*(.+?)\*/g, "$1")
    .replace(/~~(.+?)~~/g, "$1")
    .replace(/`(.+?)`/g, "$1")
    .trim();
}

function relativeTime(timestamp) {
  const diff = Math.max(0, Date.now() - timestamp);
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const day = 24 * hour;
  if (diff < minute) return "刚刚";
  if (diff < hour) return `${Math.floor(diff / minute)}分钟前`;
  if (diff < day) return `${Math.floor(diff / hour)}小时前`;
  const days = Math.floor(diff / day);
  if (days === 1) return "昨天";
  if (days < 7) return `${days}天前`;
  return formatDate(timestamp);
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleDateString("zh-CN");
}

function formatDateTime(timestamp) {
  return new Date(timestamp).toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function icon(templateId) {
  return document.getElementById(templateId).innerHTML;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("\n", " ");
}
