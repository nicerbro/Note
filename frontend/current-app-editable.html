<!doctype html>
<!--
  当前应用前端可编辑版
  - 来源：frontend/index.html + styles.css + tauri-bridge.js + app.js
  - 你可以直接修改本文件中的 HTML/CSS/JS。
  - 图片和图标仍引用 frontend/assets 下的相对路径。
  - 确认后我可以把修改同步回正式应用文件。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>当前应用前端可编辑版</title>
  <link rel="icon" type="image/png" href="assets/images/app-icon.png">
  <link rel="apple-touch-icon" href="assets/images/app-icon.png">
  <style>
:root {
      --page: #ffffff;
      --panel: #eef1f5;
      --surface: #ffffff;
      --field: #f7f8fa;
      --ink: #2f3137;
      --muted: #8f96a3;
      --soft: #b8c0cc;
      --line: #e4e8ee;
      --active: #3f4048;
      --active-hover: #303139;
      --danger: #c94f4f;
      --radius-xl: 16px;
      --radius-lg: 12px;
      --shadow: 0 16px 40px rgba(42, 47, 56, 0.09);
      --window-shadow-space: 0px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    * {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: transparent;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: transparent;
      overflow: hidden;
    }

    .desktop-shell,
    .desktop-shell body {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    .desktop-shell body {
      display: block;
      border-radius: var(--radius-xl);
    }

    button,
    input,
    textarea,
    [contenteditable] {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .stage {
      width: min(100vw, 1024px);
      min-height: 658px;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .desktop-shell .stage {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      padding: 0;
      display: block;
      overflow: hidden;
      position: relative;
      border-radius: var(--radius-xl);
    }

    .floating-note {
      width: 902px;
      height: 1128px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 40px);
      border-radius: var(--radius-xl);
      background: var(--panel);
      background-clip: padding-box;
      box-shadow: var(--shadow);
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      position: relative;
      transform: translate(var(--window-x, 0px), var(--window-y, 0px));
    }

    .desktop-shell .floating-note {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      inset: 0;
      border: 1px solid #e3e6eb;
      border-radius: var(--radius-xl);
      overflow: hidden;
      padding: clamp(10px, 2vw, 16px);
      box-shadow: 0 10px 28px rgba(42, 47, 56, 0.08);
      transform: none;
    }

    .floating-note.is-pinned {
      box-shadow: var(--shadow);
    }

    .desktop-shell .floating-note.is-pinned {
      box-shadow: 0 10px 28px rgba(42, 47, 56, 0.08);
    }

    .floating-note.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .floating-note.is-resizing {
      user-select: none;
    }

    .resize-handle {
      position: absolute;
      z-index: 20;
      display: none;
      -webkit-app-region: no-drag;
    }

    .desktop-shell .resize-handle {
      display: block;
    }

    .resize-n,
    .resize-s {
      right: 9px;
      left: 9px;
      height: 8px;
      cursor: ns-resize;
    }

    .resize-n {
      top: 0;
    }

    .resize-s {
      bottom: 0;
    }

    .resize-e,
    .resize-w {
      top: 9px;
      bottom: 9px;
      width: 8px;
      cursor: ew-resize;
    }

    .resize-e {
      right: 0;
    }

    .resize-w {
      left: 0;
    }

    .resize-ne,
    .resize-se,
    .resize-sw,
    .resize-nw {
      width: 14px;
      height: 14px;
    }

    .resize-ne {
      top: 0;
      right: 0;
      cursor: nesw-resize;
    }

    .resize-se {
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
    }

    .resize-sw {
      bottom: 0;
      left: 0;
      cursor: nesw-resize;
    }

    .resize-nw {
      top: 0;
      left: 0;
      cursor: nwse-resize;
    }

    .draggable {
      user-select: none;
    }

    .no-drag,
    .no-drag * {
      cursor: default;
      touch-action: auto;
      -webkit-app-region: no-drag;
    }

    .topbar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
      cursor: grab;
      touch-action: none;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 30px;
      padding: 2px;
      border-radius: 999px;
      background: #f8f9fb;
    }

    .segment {
      height: 26px;
      min-width: 57px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #5b616c;
      background: transparent;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .segment img,
    .segment svg {
      width: 13px;
      height: 13px;
      object-fit: contain;
    }

    .segment.active .task-tab-icon {
      filter: brightness(0) invert(1);
    }

    .segment.active {
      color: #ffffff;
      background: var(--active);
    }

    .window-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #3f434c;
      background: #f8f9fb;
      display: inline-grid;
      place-items: center;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .icon-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .icon-btn[aria-pressed="true"] {
      color: #ffffff;
      background: var(--active);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.9;
    }

    .icon-btn img {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }

    .icon-btn[aria-pressed="true"] img {
      filter: brightness(0) invert(1);
    }

    .tools {
      height: 30px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 10px;
      flex: 0 0 auto;
    }

    .search {
      width: 100%;
      height: 30px;
      border: 0;
      outline: 0;
      border-radius: 999px;
      background: var(--field);
      color: var(--ink);
      padding: 0 14px;
      font-size: 12px;
    }

    .search::placeholder {
      color: #c1c7d0;
    }

    .primary-btn,
    .secondary-btn {
      height: 30px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .primary-btn {
      color: #ffffff;
      background: var(--active);
    }

    .primary-btn:hover {
      background: var(--active-hover);
      transform: translateY(-1px);
    }

    .secondary-btn {
      color: var(--active);
      background: #ffffff;
      border: 1px solid var(--active);
    }

    .secondary-btn:hover {
      background: #fafafa;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .content.is-task-content {
      overflow: hidden;
    }

    .floating-note.is-task-mode .tools {
      display: none;
    }

    .floating-note.is-detail-view .tools {
      display: none;
    }

    .floating-note.is-detail-view .content {
      overflow: hidden;
    }

    .note-editor,
    .note-card,
    .task-board {
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .note-editor {
      min-height: 224px;
      padding: 14px 12px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    .note-editor.is-tall {
      min-height: 360px;
    }

    .title-input,
    .body-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      resize: none;
    }

    .title-input {
      height: 25px;
      font-weight: 700;
      font-size: 15px;
    }

    .title-input::placeholder,
    .body-input::placeholder,
    .task-input::placeholder {
      color: #a9b0ba;
    }

    .body-input {
      flex: 1;
      min-height: 120px;
      font-size: 12px;
      line-height: 1.75;
    }

    .editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .note-list {
      display: grid;
      gap: 10px;
    }

    .desktop-shell .note-list {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      align-items: start;
    }

    .note-card {
      min-height: 90px;
      padding: 11px 12px 12px;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .note-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(45, 50, 60, 0.06);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .note-time {
      color: #a1a8b3;
      font-size: 8px;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .card-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .note-card:hover .card-actions,
    .note-card:focus-within .card-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .text-icon {
      width: 18px;
      height: 18px;
      color: #3f434c;
      background: transparent;
      display: inline-grid;
      place-items: center;
      padding: 0;
    }

    .text-icon:hover {
      color: #111318;
    }

    .text-icon.danger:hover {
      color: var(--danger);
    }

    .text-icon svg {
      width: 14px;
      height: 14px;
      stroke-width: 1.8;
    }

    .delete-confirm-anchor.is-confirming {
      color: transparent;
      background-color: #ffffff;
      background-image: url("assets/images/delete-confirm-small.svg");
      background-position: center;
      background-size: 18px 18px;
      background-repeat: no-repeat;
      border-radius: 50%;
    }

    .delete-confirm-anchor.is-confirming svg {
      opacity: 0;
    }

    .note-title {
      margin: 0 0 7px;
      color: #22242a;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      padding-right: 48px;
      overflow-wrap: anywhere;
    }

    .note-body {
      margin: 0;
      color: #4f5662;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .markdown-summary {
      position: relative;
      max-height: 132px;
      overflow: hidden;
    }

    .note-card.is-expanded .markdown-summary {
      max-height: none;
    }

    .markdown-summary.is-collapsible:not(.is-expanded)::after {
      content: "...";
      position: absolute;
      right: 0;
      bottom: 0;
      min-width: 34px;
      padding-left: 16px;
      color: #4f5662;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff 42%);
      text-align: right;
    }

    .note-card.is-expanded .markdown-summary::after {
      display: none;
    }

    .markdown-summary p,
    .markdown-summary ul,
    .markdown-summary ol {
      margin: 0 0 6px;
    }

    .markdown-summary h1,
    .markdown-summary h2,
    .markdown-summary h3 {
      margin: 0 0 6px;
      color: #2f3137;
      font-size: 13px;
      line-height: 1.35;
    }

    .markdown-summary strong {
      color: #24272e;
      font-weight: 700;
    }

    .markdown-summary ul,
    .markdown-summary ol {
      padding-left: 18px;
    }

    .note-detail {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
      min-height: 36px;
    }

    .back-btn,
    .detail-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .back-btn.icon-only,
    .detail-btn.icon-only {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      flex: 0 0 36px;
    }

    .back-btn,
    .detail-btn {
      color: var(--active);
      background: #ffffff;
    }

    .back-btn:hover,
    .detail-btn:hover {
      background: #f8f9fb;
    }

    .detail-btn.primary {
      color: #ffffff;
      background: var(--active);
    }

    .detail-btn.danger {
      color: #ffffff;
      background: var(--danger);
    }

    .detail-btn.danger:hover {
      color: #ffffff;
      background: #d65d5d;
    }

    .note-detail .detail-btn.danger.delete-confirm-anchor.is-confirming,
    .note-detail .detail-btn.danger.delete-confirm-anchor.is-confirming:hover,
    .task-detail .detail-btn.danger.delete-confirm-anchor.is-confirming,
    .task-detail .detail-btn.danger.delete-confirm-anchor.is-confirming:hover {
      color: transparent;
      background: center / 36px 36px no-repeat url("assets/images/delete-confirm-large.svg");
    }

    .back-btn svg,
    .back-btn img,
    .detail-btn svg,
    .detail-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      stroke-width: 1.8;
    }

    .detail-actions {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .detail-meta,
    .save-state,
    .resource-chip {
      color: #9099a7;
      font-size: 11px;
      line-height: 1.35;
    }

    .preview-card,
    .editor-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .preview-title {
      margin: 0;
      padding: 14px 14px 0;
      color: #24272e;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .preview-body,
    .rich-editor {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      color: #4f5662;
      font-size: 13px;
      line-height: 1.75;
      scrollbar-width: none;
      overflow-wrap: anywhere;
    }

    .preview-body::-webkit-scrollbar,
    .rich-editor::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .preview-body h1,
    .rich-editor h1 {
      margin: 6px 0 8px;
      color: #24272e;
      font-size: 20px;
      line-height: 1.3;
    }

    .preview-body h2,
    .rich-editor h2 {
      margin: 6px 0 8px;
      color: #24272e;
      font-size: 17px;
      line-height: 1.35;
    }

    .preview-body h3,
    .rich-editor h3 {
      margin: 6px 0 8px;
      color: #24272e;
      font-size: 15px;
      line-height: 1.4;
    }

    .preview-body p,
    .rich-editor p {
      margin: 0 0 9px;
    }

    .preview-body ul,
    .preview-body ol,
    .rich-editor ul,
    .rich-editor ol {
      margin: 0 0 9px;
      padding-left: 20px;
    }

    .preview-body .note-todo,
    .rich-editor .note-todo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px;
      color: #4f5662;
    }

    .note-todo-check {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      border: 1.5px solid #8f98a6;
      border-radius: 50%;
      background: #ffffff;
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: #ffffff;
    }

    .note-todo-check::after {
      content: "";
      width: 6px;
      height: 3px;
      border-left: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(-45deg) translateY(-1px);
      opacity: 0;
    }

    .note-todo.is-done .note-todo-check {
      border-color: #8f98a6;
      background: #8f98a6;
    }

    .note-todo.is-done .note-todo-check::after {
      opacity: 1;
    }

    .note-todo.is-done .note-todo-text {
      color: #8f98a6;
      text-decoration: line-through;
    }

    .note-todo-text {
      min-width: 1em;
      outline: 0;
    }

    .preview-body blockquote,
    .rich-editor blockquote {
      margin: 10px 0;
      padding: 8px 10px;
      border-left: 3px solid #cbd3df;
      border-radius: 0 8px 8px 0;
      background: #f7f8fa;
    }

    .preview-body hr,
    .rich-editor hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 12px 0;
    }

    .preview-body img,
    .rich-editor img {
      display: block;
      max-width: 100%;
      border-radius: 10px;
      margin: 10px 0;
      cursor: zoom-in;
      transition: box-shadow 0.16s ease, outline-color 0.16s ease;
    }

    .preview-body img.is-selected,
    .rich-editor img.is-selected {
      outline: 2px solid #9aa3af;
      outline-offset: 3px;
      box-shadow: 0 8px 24px rgba(79, 86, 98, 0.12);
    }

    .image-preview-layer {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: grid;
      place-items: center;
      padding: 26px;
      overflow: auto;
      background: rgba(17, 19, 24, 0.46);
    }

    .image-preview-layer[hidden] {
      display: none;
    }

    .image-preview-dialog {
      position: relative;
      max-width: min(920px, 92vw);
      max-height: 88vh;
    }

    .image-preview-dialog img {
      display: block;
      max-width: 100%;
      max-height: 88vh;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 24px 80px rgba(17, 19, 24, 0.26);
      cursor: zoom-in;
      transition: width 0.18s ease, max-height 0.18s ease;
    }

    .image-preview-dialog.is-zoomed img {
      width: min(150vw, 1400px);
      max-width: none;
      max-height: none;
      cursor: zoom-out;
    }

    .image-preview-close {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #2c3038;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(17, 19, 24, 0.16);
      font-size: 20px;
      line-height: 1;
    }

    .detail-title-input {
      flex: 0 0 auto;
      width: 100%;
      height: 42px;
      border: 0;
      outline: 0;
      padding: 0 14px;
      color: var(--ink);
      background: #ffffff;
      font-size: 17px;
      font-weight: 700;
    }

    .detail-title-input::placeholder,
    .rich-editor:empty::before {
      color: #aeb6c2;
    }

    .rich-toolbar {
      flex: 1 1 auto;
      min-width: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: clamp(14px, 2.5vw, 24px);
      justify-content: center;
      flex-wrap: nowrap;
      min-height: 36px;
      padding: 0 clamp(18px, 3.5vw, 34px);
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      overflow: visible;
    }

    .tool-btn {
      width: 30px;
      height: 30px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4f5662;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }

    .tool-btn:hover,
    .tool-btn.is-active {
      color: #111318;
      background: #f4f6f9;
    }

    .tool-btn img {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }

    .heading-btn img {
      width: 18px;
      height: 18px;
    }

    .tool-btn[data-command="insertUnorderedList"] img,

  <script>
(function () {
  const tauri = window.__TAURI__;

  if (typeof invoke !== "function") return;

  </script>
  <script>
const STORAGE_KEY = "floating-note-state-v3";
const LEGACY_STATE_KEY = "floating-note-state-v2";
const LEGACY_STATE_KEY_V1 = "floating-note-state-v1";
const LEGACY_NOTES_KEY = "desktop-notes";
const LEGACY_TODOS_KEY = "desktop-todos";

const defaultState = {
  mode: "notes",
  route: "home",
  detailNoteId: null,
  detailMode: "preview",
  taskView: "todo",
  taskDateFilter: "all",
  taskPriorityFilter: "all",
  detailTaskId: null,
  pinned: false,
  visible: true,
  search: "",
  editingTaskId: null,
  windowX: 0,
  windowY: 0,
  notes: [],
  tasks: []
};

let state = structuredClone(defaultState);
let saveTimer = null;
let editorSaveTimer = null;
let saveStatusText = "已自动保存";
let taskFilterResizeObserver = null;
const expandedNoteIds = new Set();

const stage = document.getElementById("stage");
const app = document.getElementById("app");
const content = document.getElementById("content");
const searchInput = document.getElementById("searchInput");
const createBtn = document.getElementById("createBtn");
const pinBtn = document.getElementById("pinBtn");
const closeBtn = document.getElementById("closeBtn");
const launcher = document.getElementById("launcher");
const imagePreviewLayer = document.getElementById("imagePreviewLayer");
const imagePreviewImg = document.getElementById("imagePreviewImg");

init();

async function init() {
  if (window.desktopWindow && window.desktopWindow.isDesktop) {
    document.documentElement.classList.add("desktop-shell");
  }
  state = normalizeState(await loadAppState());
  removeDemoTodoData();
  bindEvents();
  render();
  syncAlwaysOnTop();
}

function removeDemoTodoData() {
  state.tasks = state.tasks.filter((task) => !String(task.id || "").startsWith("demo-"));
}

function bindEvents() {
  document.querySelectorAll(".segment").forEach((button) => {
    button.addEventListener("click", () => {
      cleanupEmptyDraftTasks();
      state.mode = button.dataset.mode;
      state.route = "home";
      state.detailNoteId = null;
      state.detailTaskId = null;
      state.detailMode = "preview";
      state.search = "";
      state.editingTaskId = null;
      persistAndRender();
    });
  });

  createBtn.addEventListener("click", () => {
    if (state.mode === "notes") {
      createNoteAndEdit();
    } else {
      addBlankTask();
      persistAndRender();
    }
  });

  searchInput.addEventListener("input", (event) => {
    state.search = event.target.value;
    saveAppState();
    renderContent();
  });

  pinBtn.addEventListener("click", async () => {
    state.pinned = !state.pinned;
    await syncAlwaysOnTop();
    await saveAppState();
    renderChrome();
  });

  closeBtn.addEventListener("click", async () => {
    cleanupEmptyNotes();
    if (window.desktopWindow && typeof window.desktopWindow.hide === "function") {
      await saveAppState();
      await window.desktopWindow.hide();
      return;
    }
    state.visible = false;
    cleanupEmptyDraftTasks();
    saveAppState();
    renderChrome();
  });

  document.addEventListener("click", (event) => {
    if (state.mode !== "tasks" || !state.editingTaskId) return;
    if (event.target.closest(".task-row.editing")) return;
    saveCurrentTaskEdit({ deferRender: true });
  }, true);

  document.addEventListener("click", () => {
    closeInlineDeleteConfirms();
  });

  imagePreviewLayer.addEventListener("click", (event) => {
    if (event.target === imagePreviewLayer || event.target.closest(".image-preview-close")) {
      closeImagePreview();
      return;
    }
    if (event.target === imagePreviewImg) {
      imagePreviewImg.parentElement.classList.toggle("is-zoomed");
    }
  });

  document.querySelectorAll(".no-drag").forEach((element) => {
    element.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });
  });

  launcher.addEventListener("click", () => {
    state.visible = true;
    saveAppState();
    renderChrome();
  });

  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !imagePreviewLayer.hidden) {
      event.preventDefault();
      closeImagePreview();
      return;
    }

    if (event.key === "Escape" && state.route === "detail") {
      const openDropdown = content.querySelector(".tool-dropdown:not([hidden])");
      if (openDropdown) {
        closeHeadingMenu();
        return;
      }
      event.preventDefault();
      backToHome();
      return;
    }

    if (window.desktopWindow && window.desktopWindow.isDesktop) return;
    if (event.ctrlKey && event.key.toLowerCase() === "n") {
      event.preventDefault();
      state.visible = !state.visible;
      if (!state.visible) cleanupEmptyDraftTasks();
      persistAndRender();
    }
  });

  bindWindowDrag();
  bindWindowResize();
}

function bindWindowDrag() {
  const topbar = document.querySelector(".topbar");
  const desktopWindow = window.desktopWindow;
  const canStartNativeDrag = Boolean(
    desktopWindow &&
    desktopWindow.isDesktop &&
    typeof desktopWindow.startDragging === "function"
  );
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let originX = 0;
  let originY = 0;
  let dragging = false;
  let holdTimer = null;
  let suppressNextClick = false;

  topbar.addEventListener("pointerdown", (event) => {
    if (event.button !== undefined && event.button !== 0) return;
    if (event.target.closest(".no-drag, button, input, textarea, select, a, [contenteditable]")) return;
    if (canStartNativeDrag) {
      app.classList.add("is-dragging");
      desktopWindow.startDragging().catch((error) => {
        console.warn("desktopWindow.startDragging failed.", error);
      }).finally(() => {
        app.classList.remove("is-dragging");
      });
      return;
    }
    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    originX = state.windowX;
    originY = state.windowY;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => beginDrag(event), 160);
  });

  topbar.addEventListener("pointermove", (event) => {
    if (event.pointerId !== pointerId) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (!dragging && Math.hypot(dx, dy) > 4) beginDrag(event);
    if (!dragging) return;
    event.preventDefault();
    state.windowX = originX + dx;
    state.windowY = originY + dy;
    applyWindowPosition();
  });

  window.addEventListener("pointerup", endDrag, true);
  window.addEventListener("pointercancel", endDrag, true);
  window.addEventListener("blur", forceEndDrag);

  topbar.addEventListener("click", (event) => {
    if (!suppressNextClick) return;
    event.preventDefault();
    event.stopPropagation();
    suppressNextClick = false;
  }, true);

  function beginDrag(event) {
    if (dragging || pointerId === null) return;
    dragging = true;
    suppressNextClick = true;
    app.classList.add("is-dragging");
    try {
      topbar.setPointerCapture(event.pointerId);
    } catch {
      // Pointer capture may be unavailable in older browser shells.
    }
  }

  function endDrag(event) {
    if (event.pointerId !== pointerId) return;
    finishDrag();
  }

  function forceEndDrag() {
    if (pointerId === null) return;
    finishDrag();
  }

  function finishDrag() {
    const finishedPointerId = pointerId;
    clearTimeout(holdTimer);
    if (dragging) saveAppState();
    dragging = false;
    pointerId = null;
    app.classList.remove("is-dragging");
    if (finishedPointerId !== null) {
      try {
        topbar.releasePointerCapture(finishedPointerId);
      } catch {
        // Matching release for the optional capture above.
      }
    }
  }
}

function bindWindowResize() {
  const desktopWindow = window.desktopWindow;
  const canStartNativeResize = Boolean(
    desktopWindow &&
    desktopWindow.isDesktop &&
    typeof desktopWindow.startResizeDragging === "function"
  );
  const canResizeDesktopWindow = Boolean(
    desktopWindow &&
    desktopWindow.isDesktop &&
    typeof desktopWindow.beginResize === "function" &&
    typeof desktopWindow.resizeTo === "function" &&
    typeof desktopWindow.endResize === "function"
  );
  if (!canResizeDesktopWindow) return;

  const edges = ["n", "e", "s", "w", "ne", "se", "sw", "nw"];
  let pointerId = null;

  edges.forEach((edge) => {
    const handle = document.createElement("div");
    handle.className = `resize-handle resize-${edge}`;
    handle.dataset.edge = edge;
    app.appendChild(handle);

    handle.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      pointerId = event.pointerId;
      app.classList.add("is-resizing");
      if (canStartNativeResize) {
        desktopWindow.startResizeDragging(edge).catch((error) => {
          console.warn("desktopWindow.startResizeDragging failed.", error);
        }).finally(() => {
          pointerId = null;
          app.classList.remove("is-resizing");
        });
        return;
      }
      desktopWindow.beginResize(edge, { x: event.screenX, y: event.screenY }).catch((error) => {
        console.warn("desktopWindow.beginResize failed.", error);
      });
      try {
        handle.setPointerCapture(event.pointerId);
      } catch {
        // Pointer capture may be unavailable in older browser shells.
      }
    });

    handle.addEventListener("pointermove", (event) => {
      if (event.pointerId !== pointerId) return;
      event.preventDefault();
      desktopWindow.resizeTo({ x: event.screenX, y: event.screenY }).catch((error) => {
        console.warn("desktopWindow.resizeTo failed.", error);
      });
    });

    handle.addEventListener("pointerup", endResize);
    handle.addEventListener("pointercancel", endResize);

    function endResize(event) {
      if (event.pointerId !== pointerId) return;
      desktopWindow.endResize().catch((error) => {
        console.warn("desktopWindow.endResize failed.", error);
      });
      pointerId = null;
      app.classList.remove("is-resizing");
      try {
        handle.releasePointerCapture(event.pointerId);
      } catch {
        // Matching release for the optional capture above.
      }
    }
  });
}

async function loadAppState() {
  const externalStorage = window.noteStorage;
  if (externalStorage && typeof externalStorage.load === "function") {
    try {
      const externalData = await externalStorage.load();
      if (externalData) return externalData;
    } catch (error) {
      console.warn("noteStorage.load failed, fallback to localStorage.", error);
    }
  }

  const current = readJson(STORAGE_KEY);
  if (current) return current;

  const legacyState = readJson(LEGACY_STATE_KEY);
  if (legacyState) return legacyState;

  const legacyStateV1 = readJson(LEGACY_STATE_KEY_V1);
  if (legacyStateV1) return legacyStateV1;

  const legacyNotes = readJson(LEGACY_NOTES_KEY);
  const legacyTodos = readJson(LEGACY_TODOS_KEY);
  if (Array.isArray(legacyNotes) || Array.isArray(legacyTodos)) {
    return {
      ...structuredClone(defaultState),
      notes: Array.isArray(legacyNotes) ? legacyNotes : [],
      tasks: Array.isArray(legacyTodos) ? legacyTodos : []
    };
  }

  return structuredClone(defaultState);
}

async function saveAppState() {
  const persisted = stateForPersistence();
  const externalStorage = window.noteStorage;
  if (externalStorage && typeof externalStorage.save === "function") {
    try {
      await externalStorage.save(persisted);
      return;
    } catch (error) {
      console.warn("noteStorage.save failed, fallback to localStorage.", error);
    }
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(persisted));
}

function readJson(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function stateForPersistence() {
  return {
    ...state,
    detailMode: state.detailMode === "edit" ? "preview" : state.detailMode,
    editingTaskId: null,
    notes: state.notes.filter((note) => note.title.trim() || note.content.trim() || note.markdownContent.trim()),
    tasks: state.tasks.filter((task) => task.title.trim() || task.notes.trim() || task.id === state.detailTaskId)
  };
}

function normalizeState(input) {
  const next = { ...structuredClone(defaultState), ...(input || {}) };
  next.mode = next.mode === "tasks" ? "tasks" : "notes";
  next.route = next.route === "detail" ? "detail" : "home";
  next.detailMode = next.detailMode === "edit" ? "edit" : "preview";
  next.taskView = normalizeTaskView(next.taskView);
  next.taskDateFilter = normalizeTaskDateFilter(next.taskDateFilter);
  next.taskPriorityFilter = normalizeTaskPriorityFilter(next.taskPriorityFilter);
  next.search = String(next.search || "");
  next.windowX = Number.isFinite(Number(next.windowX)) ? Number(next.windowX) : 0;
  next.windowY = Number.isFinite(Number(next.windowY)) ? Number(next.windowY) : 0;
  next.notes = Array.isArray(next.notes) ? next.notes.map(normalizeNote).filter(Boolean) : [];
  next.tasks = Array.isArray(next.tasks) ? next.tasks.map(normalizeTask).filter(Boolean) : [];
  next.notes.sort((a, b) => b.updatedAt - a.updatedAt);
  next.tasks.sort(compareTasks);
  if (next.mode === "notes" && next.route === "detail" && !next.notes.some((note) => note.id === next.detailNoteId)) {
    next.route = "home";
    next.detailNoteId = null;
  }
  if (next.mode === "tasks" && next.route === "detail" && !next.tasks.some((task) => task.id === next.detailTaskId)) {
    next.route = "home";
    next.detailTaskId = null;
  }
  return next;
}

function normalizeNote(note) {
  if (!note || typeof note !== "object") return null;
  const createdAt = parseTime(note.createdAt || Date.now());
  const legacyContent = String(note.content || "");
  const markdownContent = String(note.markdownContent || legacyContent || "");
  return {
    id: String(note.id || createId()),
    title: String(note.title || ""),
    content: String(note.content || markdownToPlainText(markdownContent)),
    markdownContent,
    images: Array.isArray(note.images) ? note.images : [],
    createdAt,
    updatedAt: parseTime(note.updatedAt || note.createdAt || createdAt)
  };
}

function normalizeTask(task) {
  if (!task || typeof task !== "object") return null;
  const title = String(task.title ?? task.content ?? task.text ?? "");
  const notes = String(task.notes ?? task.description ?? "");
  const completed = Boolean(task.completed);
  const status = normalizeTaskStatus(task.status || (completed ? "done" : "todo"));
  const createdAt = parseTime(task.createdAt || Date.now());
  const updatedAt = parseTime(task.updatedAt || task.createdAt || createdAt);
  const dueDate = normalizeTaskDueDate(task.dueDate || task.due || null);
  const priority = normalizeTaskPriority(task.priority);
  return {
    id: String(task.id || createId()),
    title,
    content: title,
    notes,
    status,
    priority,
    dueDate,
    tags: Array.isArray(task.tags) ? task.tags.map((tag) => String(tag).trim()).filter(Boolean) : parseTags(task.tags),
    createdAt,
    updatedAt,
    completed: status === "done",
    completedAt: task.completedAt ? parseTime(task.completedAt) : status === "done" ? updatedAt : null
  };
}

function normalizeTaskView(view) {
  if (view === "pending") return "todo";
  if (view === "completed") return "done";
  return ["all", "todo", "doing", "done"].includes(view) ? view : "todo";
}

function normalizeTaskStatus(status) {
  if (status === "completed") return "done";
  if (status === "pending") return "todo";
  return ["todo", "doing", "done"].includes(status) ? status : "todo";
}

function normalizeTaskPriority(priority) {
  return ["high", "medium", "low", "none"].includes(priority) ? priority : "none";
}

function normalizeTaskDateFilter(filter) {
  return ["all", "today", "soon", "overdue", "none"].includes(filter) ? filter : "all";
}

function normalizeTaskPriorityFilter(filter) {
  return ["all", "high", "medium", "low", "none"].includes(filter) ? filter : "all";
}

function normalizeTaskDueDate(value) {
  if (!value) return "";
  const text = String(value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  const parsed = Date.parse(text);
  if (!Number.isFinite(parsed)) return "";
  const date = new Date(parsed);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function parseTags(value) {
  if (!value) return [];
  return String(value)
    .split(/[,，#\s]+/)
    .map((tag) => tag.trim())
    .filter(Boolean);
}

function parseTime(value) {
  if (typeof value === "number" && Number.isFinite(value)) return value;
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? parsed : Date.now();
}

function createId() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") return crypto.randomUUID();
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function persistAndRender() {
  saveAppState();
  render();
}

function render() {
  renderChrome();
  renderContent();
}

function renderChrome() {
  stage.classList.toggle("app-closed", !state.visible);
  app.classList.toggle("is-pinned", state.pinned);
  app.classList.toggle("is-detail-view", state.route === "detail");
  app.classList.toggle("is-task-mode", state.mode === "tasks" && state.route !== "detail");
  applyWindowPosition();
  pinBtn.setAttribute("aria-pressed", String(state.pinned));
  pinBtn.title = state.pinned ? "取消置顶" : "置顶";

  document.querySelectorAll(".segment").forEach((button) => {
    const active = button.dataset.mode === state.mode;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  const noteIcon = document.querySelector(".note-tab-icon");
  if (noteIcon) {
    noteIcon.src = state.mode === "notes" ? "assets/images/notebook-W.svg" : "assets/images/notebook-B.svg";
  }

  searchInput.value = state.search;
  searchInput.placeholder = state.mode === "notes" ? "搜索笔记" : "搜索待办";
  createBtn.textContent = state.mode === "notes" ? "新建笔记" : "新建待办";
}

function applyWindowPosition() {
  app.style.setProperty("--window-x", `${state.windowX}px`);
  app.style.setProperty("--window-y", `${state.windowY}px`);
}

async function syncAlwaysOnTop() {
  const desktopWindow = window.desktopWindow;
  if (!desktopWindow || typeof desktopWindow.setAlwaysOnTop !== "function") return;
  try {
    state.pinned = await desktopWindow.setAlwaysOnTop(state.pinned);
  } catch (error) {
    console.warn("desktopWindow.setAlwaysOnTop failed.", error);
  }
}

function renderContent() {
  if (taskFilterResizeObserver) {
    taskFilterResizeObserver.disconnect();
    taskFilterResizeObserver = null;
  }
  content.innerHTML = "";
  content.classList.toggle("is-task-content", state.mode === "tasks");
  if (state.mode === "notes") renderNotes();
  if (state.mode === "tasks") renderTasks();
}

function renderNotes() {
  if (state.route === "detail") {
    renderNoteDetail();
    return;
  }

  const list = document.createElement("div");
  list.className = "note-list";

  const notes = filteredNotes();
  notes.forEach((note) => {
    list.appendChild(createNoteCard(note));
  });

  if (!notes.length) {
    list.appendChild(createEmptyState(state.search ? "没有找到匹配的笔记" : "暂无笔记", "noteIcon"));
  }

  content.appendChild(list);
}

function filteredNotes() {
  const query = state.search.trim().toLowerCase();
  return state.notes
    .filter((note) => !query || `${note.title} ${note.content} ${note.markdownContent}`.toLowerCase().includes(query))
    .sort((a, b) => b.updatedAt - a.updatedAt);
}

function createNoteCard(note) {
  const expanded = expandedNoteIds.has(note.id);
  const canExpand = shouldShowExpand(note);
  const card = document.createElement("article");
  card.className = `note-card${expanded ? " is-expanded" : ""}`;
  card.tabIndex = 0;
  card.innerHTML = `
    <div class="card-head">
      <div>
        <div class="note-time">${formatDate(note.updatedAt)}</div>
        <h3 class="note-title">${escapeHtml(note.title || "无标题")}</h3>
      </div>
      <div class="card-actions">
        <button class="text-icon" type="button" data-action="edit" title="编辑" aria-label="编辑笔记">${icon("editIcon")}</button>
        <button class="text-icon danger" type="button" data-action="delete" title="删除" aria-label="删除笔记">${icon("deleteIcon")}</button>
      </div>
    </div>
    <div class="note-body markdown-summary${canExpand ? " is-collapsible" : ""}">${markdownToSummaryHtml(note.markdownContent || note.content)}</div>
    ${canExpand ? `<button class="link-btn note-expand-btn" type="button" data-action="expand">${expanded ? "收起" : "展开"}</button>` : ""}
  `;

  card.addEventListener("click", (event) => {
    if (event.target.closest("button")) return;
    card.focus();
  });
  card.addEventListener("dblclick", (event) => {
    if (event.target.closest("button")) return;
    openNoteDetail(note.id, "edit");
  });
  card.addEventListener("focusout", (event) => {
    if (card.contains(event.relatedTarget)) return;
    if (!expandedNoteIds.has(note.id)) return;
    expandedNoteIds.delete(note.id);
    renderContent();
  });
  card.addEventListener("keydown", (event) => {
    if (event.key === "Enter") openNoteDetail(note.id, "edit");
  });

  card.querySelector('[data-action="edit"]').addEventListener("click", () => openNoteDetail(note.id, "edit"));
  bindInlineDeleteConfirm(card.querySelector('[data-action="delete"]'), () => deleteNote(note.id));
  const expandButton = card.querySelector('[data-action="expand"]');
  if (expandButton) {
    expandButton.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (expandedNoteIds.has(note.id)) {
        expandedNoteIds.delete(note.id);
        card.classList.remove("is-expanded");
        expandButton.textContent = "展开";
      } else {
        expandedNoteIds.add(note.id);
        card.classList.add("is-expanded");
        expandButton.textContent = "收起";
      }
      card.focus();
    });
  }
  card.dataset.noteId = note.id;

  return card;
}

function bindNoteEditor(root, note) {
  const titleInput = root.querySelector(".detail-title-input");
  const editor = root.querySelector(".rich-editor");
  const imageInput = root.querySelector(".image-input");
  let savedEditorRange = null;
  const rememberEditorSelection = () => {
    savedEditorRange = captureEditorRange(editor) || savedEditorRange;
  };
  const restoreEditorSelection = () => {
    restoreEditorRange(editor, savedEditorRange);
  };

  requestAnimationFrame(() => titleInput.focus());
  bindToolbarOverflow(root);

  root.querySelectorAll(".rich-toolbar button").forEach((button) => {
    button.addEventListener("pointerdown", (event) => {
      rememberEditorSelection();
      event.preventDefault();
    });
  });

  root.querySelectorAll("[data-command]").forEach((button) => {
    button.addEventListener("click", () => {
      restoreEditorSelection();
      document.execCommand(button.dataset.command, false, null);
      editor.focus();
      updateToolbarState(root);
      scheduleNoteAutoSave(root, note);
    });
  });

  root.querySelectorAll(".tool-option[data-format]").forEach((button) => {
    button.addEventListener("click", () => {
      restoreEditorSelection();
      document.execCommand("formatBlock", false, button.dataset.format);
      editor.focus();
      closeHeadingMenu();
      updateToolbarState(root);
      scheduleNoteAutoSave(root, note);
    });
  });

  root.querySelector(".heading-btn").addEventListener("click", (event) => {
    event.stopPropagation();
    const dropdown = root.querySelector(".tool-dropdown");
    const shouldOpen = dropdown.hidden;
    dropdown.hidden = !shouldOpen;
    root.querySelector(".heading-btn").setAttribute("aria-expanded", String(shouldOpen));
  });

  root.querySelector('[data-action="quote"]').addEventListener("click", () => {
    restoreEditorSelection();
    document.execCommand("formatBlock", false, "blockquote");
    editor.focus();
    updateToolbarState(root);
    scheduleNoteAutoSave(root, note);
  });

  root.querySelector('[data-action="todo"]').addEventListener("click", () => {
    restoreEditorSelection();
    convertCurrentLineToTodo(editor);
    editor.focus();
    scheduleNoteAutoSave(root, note);
  });

  root.querySelector('[data-action="image"]').addEventListener("click", () => {
    restoreEditorSelection();
    imageInput.click();
  });
  imageInput.addEventListener("change", () => {
    restoreEditorSelection();
    handleImageUpload(root, note, imageInput);
  });

  titleInput.addEventListener("input", () => scheduleNoteAutoSave(root, note));
  editor.addEventListener("input", () => {
    rememberEditorSelection();
    scheduleNoteAutoSave(root, note);
  });
  editor.addEventListener("focus", rememberEditorSelection);
  editor.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const todo = currentNoteTodoFromSelection(editor);
    if (!todo) return;
    event.preventDefault();
    insertTodoAfter(todo);
    scheduleNoteAutoSave(root, note);
  });
  editor.addEventListener("click", (event) => {
    const image = event.target.closest("img");
    if (image && editor.contains(image)) {
      selectEditorImage(editor, image);
      rememberEditorSelection();
      return;
    }
    clearSelectedEditorImages(editor);

    const checkbox = event.target.closest(".note-todo-check");
    if (!checkbox) return;
    event.preventDefault();
    const todo = checkbox.closest(".note-todo");
    todo.classList.toggle("is-done");
    todo.dataset.checked = todo.classList.contains("is-done") ? "true" : "false";
    scheduleNoteAutoSave(root, note);
  });
  editor.addEventListener("dblclick", (event) => {
    const image = event.target.closest("img");
    if (!image || !editor.contains(image)) return;
    event.preventDefault();
    selectEditorImage(editor, image);
    openImagePreview(image);
  });
  editor.addEventListener("keyup", () => {
    rememberEditorSelection();
    updateToolbarState(root);
  });
  editor.addEventListener("mouseup", () => {
    rememberEditorSelection();
    updateToolbarState(root);
  });
  root.addEventListener("click", (event) => {
    if (!event.target.closest(".tool-menu")) closeHeadingMenu();
    if (!event.target.closest(".tool-overflow")) closeToolbarOverflowMenus(root);
  });
}

function bindToolbarOverflow(root) {
  const toolbar = root.querySelector(".rich-toolbar");
  const overflow = toolbar && toolbar.querySelector(".tool-overflow");
  const overflowButton = overflow && overflow.querySelector(".overflow-btn");
  const overflowMenu = overflow && overflow.querySelector(".tool-overflow-menu");
  if (!toolbar || !overflow || !overflowButton || !overflowMenu) return;

  const items = Array.from(toolbar.querySelectorAll(".toolbar-item"));
  const updateOverflow = () => updateToolbarOverflow(toolbar, overflow, overflowMenu, items);
  overflowButton.addEventListener("click", (event) => {
    event.stopPropagation();
    const shouldOpen = overflowMenu.hidden;
    closeToolbarOverflowMenus(root);
    overflowMenu.hidden = !shouldOpen;
    overflowButton.setAttribute("aria-expanded", String(shouldOpen));
  });

  overflowMenu.addEventListener("click", (event) => {
    if (event.target.closest(".tool-dropdown, .heading-btn")) return;
    closeToolbarOverflowMenus(root);
  });

  requestAnimationFrame(updateOverflow);
  if (typeof ResizeObserver === "function") {
    const observer = new ResizeObserver(updateOverflow);
    observer.observe(toolbar);
  } else {
    window.addEventListener("resize", updateOverflow);
  }
}

function updateToolbarOverflow(toolbar, overflow, overflowMenu, items) {
  overflowMenu.hidden = true;
  const overflowButton = overflow.querySelector(".overflow-btn");
  if (overflowButton) overflowButton.setAttribute("aria-expanded", "false");

  items.forEach((item) => {
    toolbar.insertBefore(item, overflow);
  });
  overflow.hidden = true;

  let visibleItems = [...items];
  while (toolbar.scrollWidth > toolbar.clientWidth && visibleItems.length) {
    overflow.hidden = false;
    const item = visibleItems.pop();
    overflowMenu.insertBefore(item, overflowMenu.firstChild);
  }

  overflow.hidden = !overflowMenu.querySelector(".toolbar-item");
}

function closeToolbarOverflowMenus(root = document) {
  root.querySelectorAll(".tool-overflow-menu").forEach((menu) => {
    menu.hidden = true;
  });
  root.querySelectorAll(".overflow-btn").forEach((button) => {
    button.setAttribute("aria-expanded", "false");
  });
}

function convertCurrentLineToTodo(editor) {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount || !editor.contains(selection.anchorNode)) {
    editor.appendChild(noteTodoElement("待办事项", false));
    placeCaretInNode(editor.lastElementChild.querySelector(".note-todo-text"));
    return;
  }

  const block = closestEditableBlock(selection.anchorNode, editor);
  if (block && block.classList && block.classList.contains("note-todo")) {
    return;
  }

  const text = block ? block.textContent.trim() : "";
  const todo = noteTodoElement(text || "待办事项", false);
  if (block && block !== editor) {
    block.replaceWith(todo);
  } else if (selection.anchorNode && selection.anchorNode.nodeType === Node.TEXT_NODE && selection.anchorNode.parentNode === editor) {
    selection.anchorNode.replaceWith(todo);
  } else {
    const range = selection.getRangeAt(0);
    range.insertNode(todo);
  }
  placeCaretInNode(todo.querySelector(".note-todo-text"));
}

function currentNoteTodoFromSelection(editor) {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount || !editor.contains(selection.anchorNode)) return null;
  return closestNode(selection.anchorNode, ".note-todo", editor);
}

function insertTodoAfter(todo) {
  const next = noteTodoElement("", false);
  const textNode = next.querySelector(".note-todo-text");
  textNode.innerHTML = "<br>";
  todo.after(next);
  placeCaretInNode(textNode);
}

function noteTodoElement(text, checked) {
  const wrapper = document.createElement("div");
  wrapper.innerHTML = createNoteTodoHtml(text, checked);
  return wrapper.firstElementChild;
}

function closestEditableBlock(node, editor) {
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  const block = element && element.closest("p, div, h1, h2, h3, blockquote, li");
  return block && editor.contains(block) ? block : editor;
}

function closestNode(node, selector, boundary) {
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  const match = element && element.closest(selector);
  return match && boundary.contains(match) ? match : null;
}

function placeCaretInNode(node) {
  const selection = window.getSelection();
  if (!selection || !node) return;
  const range = document.createRange();
  range.selectNodeContents(node);
  range.collapse(false);
  selection.removeAllRanges();
  selection.addRange(range);
}

function nodeInside(node, container) {
  if (!node || !container) return false;
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  return node === container || Boolean(element && container.contains(element));
}

function captureEditorRange(editor) {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount) return null;
  const range = selection.getRangeAt(0);
  return nodeInside(range.commonAncestorContainer, editor) ? range.cloneRange() : null;
}

function restoreEditorRange(editor, range) {
  if (!range || !nodeInside(range.commonAncestorContainer, editor)) return false;
  const selection = window.getSelection();
  if (!selection) return false;
  selection.removeAllRanges();
  selection.addRange(range);
  return true;
}

function selectEditorImage(editor, image) {
  clearSelectedEditorImages(editor);
  image.classList.add("is-selected");
}

function clearSelectedEditorImages(editor) {
  editor.querySelectorAll("img.is-selected").forEach((image) => {

function openImagePreview(image) {
  imagePreviewImg.src = image.currentSrc || image.src;

function closeImagePreview() {

function scheduleNoteAutoSave(root, note) {
  const status = root.querySelector(".save-state");
  saveStatusText = "正在自动保存...";
  if (status) status.textContent = saveStatusText;
  clearTimeout(editorSaveTimer);
  editorSaveTimer = setTimeout(async () => {
    commitEditorToNote(root, note);
    await saveAppState();
    saveStatusText = "已自动保存";
    if (status) status.textContent = saveStatusText;
  }, 320);
}

function commitEditorToNote(root, note) {
  const titleInput = root.querySelector(".detail-title-input");
  const editor = root.querySelector(".rich-editor");
  note.title = titleInput.value.trim();
  note.markdownContent = htmlToMarkdown(editor.innerHTML);
  note.content = markdownToPlainText(note.markdownContent);
  note.updatedAt = Date.now();
}

async function handleImageUpload(root, note, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const dataUrl = await fileToDataUrl(file);
  let image = {
    id: createId(),
    name: file.name,
    markdownPath: dataUrl,
    src: dataUrl
  };

  if (window.noteStorage && typeof window.noteStorage.saveNoteImage === "function") {
    try {
      image = await window.noteStorage.saveNoteImage(note.id, file.name, dataUrl);
    } catch (error) {
      console.warn("noteStorage.saveNoteImage failed, using embedded preview.", error);
    }
  }

  note.images = [...note.images.filter((item) => item.markdownPath !== image.markdownPath), image];
  const editor = root.querySelector(".rich-editor");
  document.execCommand("insertHTML", false, `<img src="${escapeAttr(image.src)}" data-markdown-src="${escapeAttr(image.markdownPath)}" alt="${escapeAttr(image.name)}">`);
  editor.focus();
  input.value = "";
  scheduleNoteAutoSave(root, note);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function currentNote() {
  return state.notes.find((note) => note.id === state.detailNoteId);
}

function backToHome() {
  if (state.mode === "tasks") {
    const detail = content.querySelector(".task-detail");
    const task = currentTask();
    if (detail && task) commitTaskDetail(detail, task);
    cleanupEmptyDraftTasks();
    state.route = "home";
    state.detailTaskId = null;
    saveStatusText = "已保存";
    persistAndRender();
    return;
  }

  const detail = content.querySelector(".note-detail.is-editing");
  const note = currentNote();
  if (detail && note) commitEditorToNote(detail, note);
  cleanupEmptyNotes();
  state.route = "home";
  state.detailNoteId = null;
  state.detailMode = "preview";
  saveStatusText = "已保存";
  persistAndRender();
}

function deleteNote(noteId) {
  state.notes = state.notes.filter((note) => note.id !== noteId);
  if (state.detailNoteId === noteId) {
    state.route = "home";
    state.detailNoteId = null;
    state.detailMode = "preview";
  }
  persistAndRender();
}

function cleanupEmptyNotes() {
  state.notes = state.notes.filter((note) => note.title.trim() || note.content.trim() || note.markdownContent.trim());
}

function shouldShowExpand(note) {
  const plain = markdownToPlainText(note.markdownContent || note.content);
  return plain.length > 90 || String(note.markdownContent || note.content).split(/\r?\n/).length > 3;
}

function closeHeadingMenu() {
  content.querySelectorAll(".tool-dropdown").forEach((dropdown) => {
    dropdown.hidden = true;
  });
  content.querySelectorAll(".heading-btn").forEach((button) => {
    button.setAttribute("aria-expanded", "false");
  });
}

function updateToolbarState(root) {
  let block = "";
  try {
    block = String(document.queryCommandValue("formatBlock") || "").toLowerCase();
  } catch {
    block = "";
  }
  const normalizedBlock = block || "p";
  const headingButton = root.querySelector(".heading-btn");
  if (headingButton) headingButton.classList.toggle("is-active", ["h1", "h2", "h3"].includes(normalizedBlock));
  root.querySelectorAll(".tool-option[data-format]").forEach((button) => {
    button.classList.toggle("is-active", normalizedBlock === button.dataset.format);
  });
  root.querySelectorAll("[data-command]").forEach((button) => {
    const command = button.dataset.command;
    if (["undo", "redo", "insertHorizontalRule"].includes(command)) return;
    let active = false;
    try {
      active = document.queryCommandState(command);
    } catch {
      active = false;
    }
    button.classList.toggle("is-active", active);
  });
}

function renderTasks() {
  if (state.route === "detail") {
    renderTaskDetail();
    return;
  }

  const board = document.createElement("section");
  board.className = "task-board";
  board.appendChild(createTaskFilters());
  board.appendChild(createTaskList(filteredTasks()));

function createTaskSelectHtml(config) {
  const active = config.options.find(([value]) => value === config.value) || config.options[0];
  const activeLabel = splitTaskSelectLabel(active[1]);
  return `
    <span class="task-select-wrap" data-filter-field="${config.field}">
      <button class="task-select-button" type="button" aria-label="${escapeAttr(config.label)}" aria-haspopup="listbox" aria-expanded="false">
        <span class="task-select-label">${escapeHtml(config.prefix.replace("：", ""))}</span>
        <span class="task-select-value">${escapeHtml(activeLabel.text)}</span>
        <span class="task-select-count">${escapeHtml(activeLabel.count)}</span>
      </button>
      <div class="task-select-menu" role="listbox" hidden>
        ${config.options.map(([value, label]) => `
          <button class="task-select-option" type="button" role="option" data-value="${escapeAttr(value)}" aria-selected="${value === config.value}">
            ${escapeHtml(label)}
          </button>
        `).join("")}
      </div>
    </span>
  `;
}

function splitTaskSelectLabel(label) {
  const match = String(label).match(/^(.*?)（(\d+)）$/);
  if (!match) return { text: String(label), count: "" };
  return { text: match[1], count: match[2] };
}

function bindTaskFilterSelects(root) {
  root.querySelectorAll(".task-select-wrap").forEach((wrap) => {
    const button = wrap.querySelector(".task-select-button");
    const menu = wrap.querySelector(".task-select-menu");

    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const shouldOpen = menu.hidden;
      closeTaskFilterMenus(root);
      menu.hidden = !shouldOpen;
      button.setAttribute("aria-expanded", String(shouldOpen));
      if (shouldOpen) {
        setTimeout(() => {
          document.addEventListener("click", () => closeTaskFilterMenus(root), { once: true });
        }, 0);
      }
    });

    wrap.querySelectorAll(".task-select-option").forEach((option) => {
      option.addEventListener("click", (event) => {
        event.stopPropagation();
        state[wrap.dataset.filterField] = option.dataset.value;
        closeTaskFilterMenus(root);
        persistAndRender();
      });
    });
  });

}

function bindTaskFilterCountVisibility(root) {
  const update = () => updateTaskFilterCountVisibility(root);
  requestAnimationFrame(update);
  if (typeof ResizeObserver !== "function") {
    window.addEventListener("resize", update, { once: true });
    return;
  }
  taskFilterResizeObserver = new ResizeObserver(update);
  taskFilterResizeObserver.observe(root);
  root.querySelectorAll(".task-select-wrap").forEach((wrap) => {
    taskFilterResizeObserver.observe(wrap);
  });
}

function updateTaskFilterCountVisibility(root) {
  root.querySelectorAll(".task-select-wrap").forEach((wrap) => {
    const button = wrap.querySelector(".task-select-button");
    const label = wrap.querySelector(".task-select-label");
    const value = wrap.querySelector(".task-select-value");
    const count = wrap.querySelector(".task-select-count");
    if (!button || !label || !value || !count) return;

    wrap.classList.remove("is-count-hidden");
    const styles = getComputedStyle(button);
    const padding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
    const gap = parseFloat(styles.columnGap || styles.gap || "0");
    const minimumValueWidth = Math.min(Math.max(value.scrollWidth, 24), 36);
    const requiredWidth = label.offsetWidth + minimumValueWidth + count.offsetWidth + padding + gap * 2;
    wrap.classList.toggle("is-count-hidden", button.clientWidth < requiredWidth);
  });
}

function closeTaskFilterMenus(root = document) {
  root.querySelectorAll(".task-select-menu").forEach((menu) => {
    menu.hidden = true;
  });
  root.querySelectorAll(".task-select-button").forEach((button) => {
    button.setAttribute("aria-expanded", "false");
  });
}

function taskCountByView(view) {
  return state.tasks.filter((task) => view === "all" || task.status === view).length;
}

function taskCountByDateFilter(filter) {
  return state.tasks.filter((task) => filter === "all" || taskMatchesDateFilter(task, filter)).length;
}

function taskCountByPriorityFilter(filter) {
  return state.tasks.filter((task) => filter === "all" || task.priority === filter).length;
}

function filteredTasks() {
  const query = state.search.trim().toLowerCase();
  return state.tasks
    .filter((task) => state.taskView === "all" || task.status === state.taskView)
    .filter((task) => state.taskDateFilter === "all" || taskMatchesDateFilter(task, state.taskDateFilter))
    .filter((task) => state.taskPriorityFilter === "all" || task.priority === state.taskPriorityFilter)
    .filter((task) => {
      if (!query) return true;
      return `${task.title} ${task.notes} ${task.tags.join(" ")}`.toLowerCase().includes(query);
    })
    .sort(compareTasks);
}

function createTaskList(tasks) {
  const list = document.createElement("div");
  list.className = "task-list";
  tasks.forEach((task) => list.appendChild(createTaskCard(task)));

  if (!tasks.length) {
    const emptyMessage = state.tasks.length ? "没有匹配的待办" : "暂无待办事项";
    list.appendChild(createEmptyState(emptyMessage, "taskIcon"));
  }

  return list;
}

function addBlankTask() {
  cleanupEmptyDraftTasks();
  const now = Date.now();
  const task = {
    id: createId(),
    title: "",
    content: "",
    notes: "",
    status: "todo",
    priority: "none",
    dueDate: "",
    tags: [],
    createdAt: now,
    updatedAt: now,
    completed: false,
    completedAt: null
  };
  state.mode = "tasks";
  state.route = "detail";
  state.detailTaskId = task.id;
  state.taskView = "todo";
  state.search = "";
  state.tasks.unshift(task);
}

function createTaskCard(task) {
  const card = document.createElement("article");
  const metaItems = taskMetaItems(task);
  card.className = `task-card${task.status === "done" ? " completed" : ""}`;
  card.tabIndex = 0;
  card.innerHTML = `
    <button class="check" type="button" aria-label="${task.status === "done" ? "恢复待办" : "完成待办"}">${icon("checkIcon")}</button>
    <div class="task-card-main">
      <div class="task-title-line">
        <h3 class="task-title">${escapeHtml(task.title || "新待办")}</h3>
      </div>
      ${task.notes ? `<p class="task-note">${escapeHtml(task.notes)}</p>` : ""}
      <div class="task-meta-row">
        ${metaItems.map((item) => `<span class="task-meta-text ${escapeAttr(item.className)}">${item.className === "tag" ? "#" : ""}${escapeHtml(item.label)}</span>`).join("")}
      </div>
    </div>
    <div class="task-actions">
      <button class="text-icon" type="button" data-action="edit" title="编辑" aria-label="编辑待办">${icon("editIcon")}</button>
      <button class="text-icon danger" type="button" data-action="delete" title="删除" aria-label="删除待办">${icon("deleteIcon")}</button>
    </div>
  `;

  card.addEventListener("dblclick", (event) => {
    if (event.target.closest("button")) return;
    openTaskDetail(task.id);
  });
  card.querySelector(".check").addEventListener("click", () => toggleTask(task.id));
  card.querySelector('[data-action="edit"]').addEventListener("click", () => openTaskDetail(task.id));
  bindInlineDeleteConfirm(card.querySelector('[data-action="delete"]'), () => deleteTask(task.id));
  return card;
}

function taskMetaItems(task) {
  const items = [];
  const priority = taskPriorityLabel(task.priority);
  if (priority) items.push({ label: priority, className: `priority-${task.priority}` });
  if (task.dueDate) items.push({ label: formatTaskDueDate(task), className: taskDueMetaClass(task) });
  items.push({ label: taskStatusLabel(task.status), className: `status-${task.status}` });
  task.tags.forEach((tag) => {
    const normalized = String(tag || "").trim().replace(/^#+/, "");
    if (normalized) items.push({ label: normalized, className: "tag" });
  });
  return items;
}

function taskDueMetaClass(task) {
  if (!task.dueDate) return "due-none";
  if (isTaskOverdue(task)) return "due-overdue";
  if (isTaskDueToday(task)) return "due-today";
  if (isTaskDueSoon(task)) return "due-soon";
  return "due";
}

function openTaskDetail(taskId) {
  state.mode = "tasks";
  state.route = "detail";
  state.detailTaskId = taskId;
  saveStatusText = "已保存";
  saveAppState();
  render();
}

function createTaskDetailSelectHtml(field, value, options) {
  const active = options.find(([optionValue]) => optionValue === value) || options[0];
  return `
    <span class="task-detail-select" data-detail-select="${escapeAttr(field)}">
      <input type="hidden" data-field="${escapeAttr(field)}" value="${escapeAttr(active[0])}">
      <button class="task-detail-select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
        ${escapeHtml(active[1])}
      </button>
      <span class="task-detail-select-menu" role="listbox" hidden>
        ${options.map(([optionValue, label]) => `
          <button class="task-detail-select-option" type="button" role="option" data-value="${escapeAttr(optionValue)}" aria-selected="${optionValue === active[0]}">
            ${escapeHtml(label)}
          </button>
        `).join("")}
      </span>
    </span>
  `;
}

function createTaskDatePickerHtml(value) {
  const display = value ? formatDisplayDate(value) : "年 / 月 / 日";
  const viewDate = value || todayIsoDate();
  return `
    <span class="task-date-picker" data-date-picker data-view-date="${escapeAttr(viewDate)}">
      <input type="hidden" data-field="dueDate" value="${escapeAttr(value || "")}">
      <button class="task-date-button" type="button" aria-haspopup="dialog" aria-expanded="false">
        ${escapeHtml(display)}
      </button>
      <span class="task-date-panel" hidden></span>
    </span>
  `;
}

function bindTaskDetail(root, task) {
  root.querySelector('[data-action="back"]').addEventListener("click", () => backToHome());
  bindInlineDeleteConfirm(root.querySelector('[data-action="delete"]'), () => deleteTask(task.id));

  bindTaskDetailSelects(root, task);
  bindTaskDatePicker(root, task);

  root.querySelectorAll("[data-field]").forEach((input) => {
    input.addEventListener("input", () => scheduleTaskAutoSave(root, task));
    input.addEventListener("change", () => scheduleTaskAutoSave(root, task));
  });

}

function bindTaskDatePicker(root, task) {
  const picker = root.querySelector("[data-date-picker]");
  if (!picker) return;
  const input = picker.querySelector('input[data-field="dueDate"]');
  const button = picker.querySelector(".task-date-button");
  const panel = picker.querySelector(".task-date-panel");

  button.addEventListener("click", (event) => {
    event.stopPropagation();
    const shouldOpen = panel.hidden;
    closeTaskDatePickers(root);
    panel.hidden = !shouldOpen;
    button.setAttribute("aria-expanded", String(shouldOpen));
    if (shouldOpen) {
      renderTaskDatePanel(picker);
      setTimeout(() => {
        document.addEventListener("click", () => closeTaskDatePickers(root), { once: true });
      }, 0);
    }
  });

  panel.addEventListener("click", (event) => {
    event.stopPropagation();
    const control = event.target.closest("[data-date-action], [data-date-value]");
    if (!control) return;

    if (control.dataset.dateAction === "prev") {
      picker.dataset.viewDate = shiftMonth(picker.dataset.viewDate, -1);
      renderTaskDatePanel(picker);
      return;
    }
    if (control.dataset.dateAction === "next") {
      picker.dataset.viewDate = shiftMonth(picker.dataset.viewDate, 1);
      renderTaskDatePanel(picker);
      return;
    }
    if (control.dataset.dateAction === "today") {
      input.value = todayIsoDate();
      picker.dataset.viewDate = input.value;
      button.textContent = formatDisplayDate(input.value);
      closeTaskDatePickers(root);
      scheduleTaskAutoSave(root, task);
      return;
    }
    if (control.dataset.dateAction === "clear") {
      input.value = "";
      button.textContent = "年 / 月 / 日";
      closeTaskDatePickers(root);
      scheduleTaskAutoSave(root, task);
      return;
    }
    if (control.dataset.dateValue) {
      input.value = control.dataset.dateValue;
      picker.dataset.viewDate = input.value;
      button.textContent = formatDisplayDate(input.value);
      closeTaskDatePickers(root);
      scheduleTaskAutoSave(root, task);
    }
  });
}

function closeTaskDatePickers(root = document) {
  root.querySelectorAll(".task-date-panel").forEach((panel) => {
    panel.hidden = true;
  });
  root.querySelectorAll(".task-date-button").forEach((button) => {
