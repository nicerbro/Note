<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" type="image/png" href="assets/images/app-icon.png">
  <link rel="apple-touch-icon" href="assets/images/app-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <section class="floating-note" id="app" aria-label="浮空笔记应用">
      <header class="topbar draggable">
        <nav class="segmented no-drag" aria-label="模式切换">
          <button class="segment active" type="button" data-mode="notes" aria-pressed="true">
            <img class="note-tab-icon" src="assets/images/notebook-W.svg" alt="" aria-hidden="true">
            笔记
          </button>
          <button class="segment" type="button" data-mode="tasks" aria-pressed="false">
            <img class="task-tab-icon" src="assets/images/_listtwo1.png" alt="" aria-hidden="true">
            任务
          </button>
        </nav>

        <div class="window-actions no-drag">
          <button class="icon-btn" type="button" id="pinBtn" title="置顶" aria-label="置顶">
            <img src="assets/images/Group_410_192573.png" alt="" aria-hidden="true">
          </button>
          <button class="icon-btn" type="button" id="closeBtn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="tools">
        <input class="search" id="searchInput" type="search" autocomplete="off" placeholder="搜索笔记" aria-label="搜索">
        <button class="primary-btn" type="button" id="createBtn">新建笔记</button>
      </div>

      <div class="content" id="content"></div>
    </section>

    <button class="launcher" type="button" id="launcher">打开浮空笔记</button>
  </main>

  <template id="editIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"></path>
    </svg>
  </template>

  <template id="deleteIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M3 6h18"></path>
      <path d="M8 6V4h8v2"></path>
      <path d="M19 6 18 20H6L5 6"></path>
      <path d="M10 11v5M14 11v5"></path>
    </svg>
  </template>

  <template id="checkIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="m5 12 4 4L19 6"></path>
    </svg>
  </template>

  <template id="noteIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z"></path>
      <path d="M10 8h5M10 12h5"></path>
    </svg>
  </template>

  <template id="taskIcon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M9 7h11M9 12h11M9 17h11"></path>
      <path d="m4 7 1 1 2-2M4 12l1 1 2-2M4 17l1 1 2-2"></path>
    </svg>
  </template>

  <script src="tauri-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
